[project]
name = "layoutscan"
version = "0.1.0"
description = "Extract the layout layer (pages, systems, measure regions) of a gts file from a scanned guitar score PDF"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pypdfium2>=4.30",
]

[project.scripts]
layoutscan = "layoutscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layoutscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
