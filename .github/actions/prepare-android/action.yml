# The phone page built for the app, plus the JDK and Gradle to build tky with.
name: Prepare the Android build
description: Builds the phone page into web/packages/demo/dist/android and sets up JDK 17 and Gradle.
inputs:
  gradle-cache:
    description: Whether Gradle may restore and save its cache ("false" for the release build).
    default: "true"
runs:
  using: composite
  steps:
    # Third-party actions are pinned to commits (tag in the comment).
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: web/.node-version

    - name: pnpm (the version in package.json "packageManager")
      shell: bash
      working-directory: web
      run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"

    - uses: ./.github/actions/japanese-font

    - name: Build the phone page for the app
      shell: bash
      working-directory: web
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter @guitarmr/demo build:android

    - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        distribution: temurin
        java-version: "17"

    # Also validates the Gradle wrapper.
    - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      with:
        cache-disabled: ${{ inputs.gradle-cache != 'true' }}
