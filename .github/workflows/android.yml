# The Android app tky (android/): the phone page built by the web workspace,
# wrapped in a WebView app. The release and the preview app have their own keys.
#
# - main: after the tests pass, release-build builds the release APK
#   (xyz.amasuda.tky) from scratch, with no Gradle cache, in the "release"
#   environment: the only place the release key is available (environment
#   secrets limited to main). release then publishes it as a GitHub Release
#   (vX.Y.N), which Obtainium tracks with default settings.
# - PRs: the preview APK (xyz.amasuda.tky.preview), signed with the preview key
#   (repository secrets TKY_PREVIEW_KEYSTORE_*), is published as a prerelease
#   "tky preview X.Y.N (PR #N)" tagged vX.Y.N-prN (its versionName), one per PR
#   (the older one is replaced), so Obtainium can install it with prereleases
#   turned on. Closing the PR removes its prereleases.
#
# Every signed APK is checked against its key's certificate before it is published.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", "schemas/**", ".github/workflows/android.yml", ".github/actions/prepare-android/**"]
  # Not filtered by path: the ruleset on main requires build, which would never
  # report on a PR left out by a filter. The changes job decides instead.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A closed PR's github.ref is the base branch, so PRs are grouped by number
  # to keep their cleanup from cancelling main's release run.
  group: android-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.ref }}
  # A main run is never cut off mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The certificates the keys must carry (public, so reviewed here rather than kept as variables).
  TKY_RELEASE_CERT_SHA256: 5d6c140480f4526577ce91c9357b8af75256e6e67172b175e33e16d8c837c9e6
  TKY_PREVIEW_CERT_SHA256: f2df2f0ebd9388502505b473f8161b150be8bae9dd1dabb506901b9f450026b3

jobs:
  # Whether a PR touches what build covers (the paths of the push filter).
  # A build skipped by its condition counts as passing for the required check.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      # A PR is checked out as its merge commit, whose first parent is the base branch.
      - name: Look for changes to the app
        id: diff
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] ||
            git diff --name-only HEAD^1 HEAD |
            grep -qE '^(android|web|schemas)/|^\.github/(workflows/android\.yml|actions/prepare-android/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # Tests, lint and the preview APK.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.keystore.outputs.signed }}
    env:
      PREVIEW_KEYSTORE_BASE64: ${{ secrets.TKY_PREVIEW_KEYSTORE_BASE64 }}
      TKY_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.TKY_PREVIEW_KEYSTORE_PASSWORD }}
      TKY_VERSION_CODE: ${{ github.run_number }}
      TKY_PREVIEW_LABEL: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-android

      # PRs from forks get no secrets: they build with the debug key and publish nothing.
      - name: Restore the preview keystore
        id: keystore
        run: |
          if [[ -z "$PREVIEW_KEYSTORE_BASE64" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tky-preview.jks"
          echo "TKY_PREVIEW_KEYSTORE_FILE=$RUNNER_TEMP/tky-preview.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Set version
        id: version
        run: |
          base=$(sed -n 's/^tky\.versionBase=//p' android/gradle.properties)
          version="$base.$GITHUB_RUN_NUMBER"
          echo "TKY_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test, lint and build the preview
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleDebug

      - name: Collect the APK
        run: |
          mkdir -p dist
          label="${TKY_PREVIEW_LABEL//[^A-Za-z0-9._-]/-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/tky-preview-$TKY_VERSION_NAME-$label.apk"

      # Also on PRs, so a broken check shows up before it can stop a release.
      - name: Check the signature
        if: steps.keystore.outputs.signed == 'true'
        run: android/scripts/verify-apk-cert.sh dist/tky-preview-*.apk "$TKY_PREVIEW_CERT_SHA256"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tky-preview
          path: dist/*.apk
          retention-days: 14

  # The release APK, built only from main and only where the release key is.
  release-build:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      KEYSTORE_BASE64: ${{ secrets.TKY_KEYSTORE_BASE64 }}
      TKY_KEYSTORE_PASSWORD: ${{ secrets.TKY_KEYSTORE_PASSWORD }}
      TKY_KEY_PASSWORD: ${{ secrets.TKY_KEY_PASSWORD }}
      TKY_VERSION_CODE: ${{ github.run_number }}
      TKY_VERSION_NAME: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # No cache: nothing from other runs reaches the job that holds the release key.
      - uses: ./.github/actions/prepare-android
        with:
          gradle-cache: "false"

      - name: Restore the release keystore
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::TKY_KEYSTORE_BASE64 is not set in the release environment: a release must be signed (see android/README.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tky.jks"
          echo "TKY_KEYSTORE_FILE=$RUNNER_TEMP/tky.jks" >> "$GITHUB_ENV"

      - name: Build the release
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/tky-$TKY_VERSION_NAME.apk"

      - name: Check the signature
        run: android/scripts/verify-apk-cert.sh "dist/tky-$TKY_VERSION_NAME.apk" "$TKY_RELEASE_CERT_SHA256"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tky-release
          path: dist/*.apk
          retention-days: 14

  # Only main publishes a GitHub Release.
  release:
    needs: [build, release-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tky-release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "tky $VERSION" --generate-notes --latest

  # A PR's preview as a prerelease for Obtainium; only the newest one per PR is kept.
  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tky-preview
          path: dist
      - name: Publish the preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The tag is the preview app's versionName, which Obtainium compares with the installed one.
          tag="v$VERSION-pr$PR"
          printf 'Preview build of #%s (%s) at %s.\n\nInstall with Obtainium (prereleases on) or download the APK below.\n' \
            "$PR" "$PR_TITLE" "${HEAD_SHA:0:7}" > notes.md
          gh release create "$tag" dist/*.apk -R "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" --title "tky preview $VERSION (PR #$PR)" --notes-file notes.md --prerelease
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
            grep -E "^v[0-9.]+-pr$PR\$" | grep -vxF "$tag" |
            xargs -r -n1 gh release delete -R "$GITHUB_REPOSITORY" --yes --cleanup-tag

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove the PR's preview prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
            grep -E "^v[0-9.]+-pr$PR\$" |
            xargs -r -n1 gh release delete -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
